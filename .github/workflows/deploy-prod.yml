# PRODUCTION deploy (ITM) — build static export and publish via S3 + SSM.
# Runs only on itmgroup-mx/portpax-frontend (skipped on johngiler BCT mirror).
# Requires IAM role (OIDC) portpax-prod-deploy-frontend, trusted for ITM main only.
#
# GitHub → Settings → Secrets and variables → Actions:
#   FRONTEND_BUILD_PUBLISH_TOKEN  (same value as backend)
#
# Actions are SHA-pinned (org policy). AWS auth is inline OIDC (no aws-actions/*).

name: Deploy production frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::040105284691:role/portpax-prod-deploy-frontend
  RELEASES_BUCKET: itm-portpax-prod-releases-040105284691
  NEXT_PUBLIC_API_URL: https://api.portpax.itmgroup.mx
  PROD_FRONTEND_INSTANCE_ID: i-086d65d99ee070a1c

jobs:
  deploy:
    if: github.repository == 'itmgroup-mx/portpax-frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assume AWS role (OIDC)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${AWS_ROLE_ARN}" \
            --role-session-name "gha-frontend-${GITHUB_RUN_ID}" \
            --web-identity-token "${TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=${AWS_REGION}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          ls -la package.json package-lock.json
          npm ci --no-fund --no-audit

      - name: Write .env.production
        env:
          FRONTEND_BUILD_PUBLISH_TOKEN: ${{ secrets.FRONTEND_BUILD_PUBLISH_TOKEN }}
        run: |
          {
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            echo "FRONTEND_BUILD_PUBLISH_TOKEN=${FRONTEND_BUILD_PUBLISH_TOKEN}"
          } > .env.production

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload release to S3
        id: upload
        run: |
          SHA="${GITHUB_SHA}"
          PREFIX="frontend/${SHA}"
          DEST="s3://${RELEASES_BUCKET}/${PREFIX}/"
          aws s3 sync out/ "$DEST" --delete
          aws s3 sync out/ "s3://${RELEASES_BUCKET}/frontend/latest/" --delete
          echo "s3_uri=${DEST}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via Session Manager
        env:
          S3_URI: ${{ steps.upload.outputs.s3_uri }}
          INSTANCE_ID: ${{ env.PROD_FRONTEND_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # AWS-RunShellScript uses /bin/sh (dash); wrap remote body in bash -lc.
          PARAMS=$(jq -nc --arg uri "$S3_URI" '
            ($uri | @sh) as $uq
            | (
                "set -euo pipefail; "
                + "S=/home/git/frontend/scripts/deploy-prod-from-s3.sh; "
                + "if [ -x \"$" + "S\" ]; then \"$" + "S\" " + $uq + "; "
                + "else mkdir -p /home/git/frontend/out /tmp/ppx-fe; "
                + "aws s3 sync " + $uq + " /tmp/ppx-fe --delete --region us-east-1; "
                + "rsync -a --delete /tmp/ppx-fe/ /home/git/frontend/out/; "
                + "chown -R git:git /home/git/frontend; "
                + "chmod -R a+rX /home/git/frontend/out; "
                + "rm -rf /tmp/ppx-fe; fi"
              ) as $body
            | {commands: ["bash -lc " + ($body | @sh)]}
          ')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "PortPax frontend deploy ${GITHUB_SHA}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId=${COMMAND_ID}"
          for i in $(seq 1 36); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "status=${STATUS}"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm list-command-invocations \
                  --command-id "$COMMAND_ID" \
                  --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" \
                  --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command"
          exit 1
