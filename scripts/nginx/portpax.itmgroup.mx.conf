# PortPax frontend — PRODUCTION nginx (ITM AWS EC2 behind ALB).
#
# TLS terminates at the load balancer. This host only listens on :80.
# Serves Next.js static export at /home/git/frontend/out
# (DEV shared host uses /home/git/portpax — do not mix).
# ALB health checks hit / with Host = instance IP → default_server must 200.
#
# Hardening matches DEV (itm.portpax.com): BCT probe drops + UA map.
#   sudo cp scripts/nginx/conf.d/webapp-maps.conf /etc/nginx/conf.d/
#   sudo cp scripts/nginx/snippets/bct-probe-drops.conf /etc/nginx/snippets/
#   sudo cp scripts/nginx/portpax.itmgroup.mx.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/portpax.itmgroup.mx.conf \
#     /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portpax.itmgroup.mx _;

    root /home/git/frontend/out;
    index index.html;

    # Same snippet as DEV itm.portpax.com (UA drop + probe paths + server_tokens).
    include /etc/nginx/snippets/bct-probe-drops.conf;

    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }
}
