# PortPax frontend — PRODUCTION nginx (ITM AWS EC2 behind ALB).
#
# TLS terminates at the load balancer. This host only listens on :80.
# Serves Next.js static export at /home/git/portpax/out.
# ALB health checks hit / with Host = instance IP → default_server must 200.
#
# Install on the frontend EC2:
#   sudo cp scripts/nginx/portpax.itmgroup.mx.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/portpax.itmgroup.mx.conf \
#     /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portpax.itmgroup.mx _;

    server_tokens off;

    root /home/git/portpax/out;
    index index.html;

    location ~* (^|/)\.(env|git|svn|htaccess|htpasswd)(/|$) {
        return 444;
    }
    location ~* (phpunit|eval-stdin\.php|wp-admin|wp-login|xmlrpc\.php|cgi-bin|vendor/phpunit) {
        return 444;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }
}
